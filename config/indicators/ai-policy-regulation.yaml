id: ai-policy-regulation
name: AI policy or regulation change
description: >
  A government or regulator proposes or adopts a rule that changes how AI
  models can be trained, released, or sold.
sources: [gdelt, rss:ai-news, rss:ai-policy, arxiv]
prefilter:
  min_cosine: 0.32
  keywords_any: ["AI Act", "export control", "executive order", "model regulation"]
positives:
  - "The European Commission proposed an amendment to the AI Act regulating open-weight models"
negatives:
  - "A company blog describes its own model policy with no government action"
questions:
  hit:
    type: noul
    instructions: "Does this item report a new or changed government rule about AI models?"
  severity:
    type: score
    instructions: "How much would this change what a lab is allowed to release?"
    criteria: ["trivial", "minor", "notable", "major", "field-changing"]
  kind:
    type: choice
    instructions: "What kind of item is this?"
    criteria:
      regulation: "proposed or adopted rule"
      commentary: "analysis without a new rule"
      release: "model release"
policy:
  alert_if: "hit >= 0.85 and severity >= 2"
  digest_if: "hit >= 0.5"
  cooldown: 24h
  push_min_confidence: 0.45
  uncertain_min: 0.15
alert:
  channels: []
