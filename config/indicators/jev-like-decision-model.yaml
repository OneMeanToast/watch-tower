id: jev-like-decision-model
name: Jev-like decision model released
description: >
  An open model that answers typed decision questions (yes/no, choice, or score)
  and returns probabilities, in the style of a System One classifier.
sources: [arxiv, rss:ai-news, bluesky]
prefilter:
  min_cosine: 0.32
  keywords_any: ["System One", "decision model", "noul", "calibrated probabilities"]
positives:
  - "An Apache-2.0 decision model was released that answers System One noul, choice, and score questions and returns calibrated probabilities"
negatives:
  - "A blog post explaining what a classifier is"
questions:
  hit:
    type: noul
    instructions: "Does this item report a new open decision model that returns calibrated probabilities for typed questions?"
  severity:
    type: score
    instructions: "How useful is this release for someone running a local classifier?"
    criteria: ["trivial", "minor", "notable", "major", "field-changing"]
  kind:
    type: choice
    instructions: "What kind of item is this?"
    criteria:
      release: "weights or code released"
      paper: "paper only"
      commentary: "opinion or explainer"
policy:
  alert_if: "hit >= 0.85 and severity >= 2"
  digest_if: "hit >= 0.5"
  cooldown: 6h
alert:
  channels: []
