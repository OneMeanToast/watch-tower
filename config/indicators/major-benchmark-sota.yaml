id: major-benchmark-sota
name: Major benchmark SOTA
description: >
  A paper or release claims a new state of the art on a widely used language
  benchmark such as MMLU.
sources: [arxiv, rss:ai-news]
prefilter:
  min_cosine: 0.32
  keywords_any: ["state-of-the-art", "state of the art", "new SOTA", "SOTA"]
positives:
  - "A new paper reports state-of-the-art results on the MMLU benchmark and a new SOTA"
negatives:
  - "A conference schedule mentions talks and datasets but no new results"
questions:
  hit:
    type: noul
    instructions: "Does this item claim a new state of the art on a major language benchmark?"
  severity:
    type: score
    instructions: "How much does the claimed gain matter?"
    criteria: ["trivial", "minor", "notable", "major", "field-changing"]
  kind:
    type: choice
    instructions: "What kind of item is this?"
    criteria:
      paper: "paper or technical report"
      release: "model release with a benchmark claim"
      commentary: "opinion or second-hand mention"
policy:
  alert_if: "hit >= 0.85 and severity >= 2"
  digest_if: "hit >= 0.5"
  cooldown: 12h
alert:
  channels: []
