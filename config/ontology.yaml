# Forensic types. SQLite is the source of truth. This file is the swap point
# for the ontology: FollowTheMoney-compatible core, plus cyber and AI types.
# LadybugDB, a local LLM, and the final schema are not wired here.

version: 1

high_value:
  daily_cap: 50
  when:
    - pushed_alert
    - starred
    - ripped
    - paper
    - advisory
  paper_sources: [arxiv, openalex]
  advisory_sources: [cisa_kev, nvd]

# Longest surface wins. The stub proposer uses this list. The model proposer does not.
stub_gazetteer:
  - {surface: "ExampleSoft Gateway", type: SoftwareProduct}
  - {surface: "ExampleSoft Inc.", type: Company}
  - {surface: "ExampleSoft", type: Organization}
  - {surface: "CISA", type: PublicBody}
  - {surface: "MIT", type: Organization}
  - {surface: "Llama", type: AIModel}

entity_types:
  - {id: Person, group: core, ftm: Person}
  - {id: Organization, group: core, ftm: Organization}
  - {id: Company, group: core, ftm: Company}
  - {id: PublicBody, group: core, ftm: PublicBody}
  - {id: Address, group: core, ftm: Address}
  - {id: Vessel, group: core, ftm: Vessel}
  - {id: Airplane, group: core, ftm: Airplane}
  - {id: Vehicle, group: core, ftm: Vehicle}
  - {id: Event, group: core, ftm: Event}
  - {id: Document, group: core, ftm: Document}
  - {id: ThreatActor, group: cyber, stix: threat-actor}
  - {id: IntrusionSet, group: cyber, stix: intrusion-set}
  - {id: Campaign, group: cyber, stix: campaign}
  - {id: Malware, group: cyber, stix: malware}
  - {id: Tool, group: cyber, stix: tool}
  - {id: Vulnerability, group: cyber, stix: vulnerability}
  - {id: AttackPattern, group: cyber, stix: attack-pattern}
  - {id: Indicator, group: cyber, stix: indicator}
  - {id: Infrastructure, group: cyber, stix: infrastructure}
  - {id: Location, group: cyber, stix: location}
  - {id: Report, group: cyber, stix: report}
  - {id: AIModel, group: ai}
  - {id: Dataset, group: ai}
  - {id: Benchmark, group: ai}
  - {id: Paper, group: ai}
  - {id: SoftwareProduct, group: ai}
  - {id: Regulation, group: ai}
  - {id: Date, group: code}
  - {id: Quantity, group: code}

relation_types:
