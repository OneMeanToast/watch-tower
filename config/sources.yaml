# Live sources. Demo mode ignores this file and reads fixtures/items.json.
# Every adapter skips cleanly when it is unconfigured or the network fails.

rss:
  per_feed: 15
  # group is the indicator key. rss:ai-news matches every feed tagged ai-news,
  # whatever the feed's own id is. ai-policy is the regulation indicator.
  feeds:
    - id: hackernews-ai
      group: ai-news
      url: https://hnrss.org/newest?q=AI
    # Weekend RSS is an empty channel (arXiv skipDays). The arxiv: section below
    # is the one that still returns papers on Saturday and Sunday.
    - id: arxiv-cs-ai-rss
      group: ai-news
      url: https://rss.arxiv.org/rss/cs.AI
    - id: techcrunch-ai
      group: ai-news
      url: https://techcrunch.com/category/artificial-intelligence/feed/
    - id: huggingface-blog
      group: ai-news
      url: https://huggingface.co/blog/feed.xml
    - id: openai-news
      group: ai-news
      url: https://openai.com/news/rss.xml
    - id: google-ai
      group: ai-news
      url: https://blog.google/technology/ai/rss/
    - id: deepmind
      group: ai-news
      url: https://deepmind.google/blog/rss.xml
    - id: simon-willison
      group: ai-news
      url: https://simonwillison.net/atom/everything/
    - id: mit-tech-review-ai
      group: ai-news
      url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    - id: verge-ai
      group: ai-news
      url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    - id: bair
      group: ai-news
      url: https://bair.berkeley.edu/blog/feed.xml
    - id: microsoft-research
      group: ai-news
      url: https://www.microsoft.com/en-us/research/feed/
    - id: interconnects
      group: ai-news
      url: https://www.interconnects.ai/feed
    - id: latent-space
      group: ai-news
      url: https://www.latent.space/feed
    - id: raschka
      group: ai-news
      url: https://magazine.sebastianraschka.com/feed
    - id: last-week-in-ai
      group: ai-news
      url: https://lastweekin.ai/feed
    - id: the-gradient
      group: ai-news
      url: https://thegradient.pub/rss/
    - id: marktechpost
      group: ai-news
      url: https://www.marktechpost.com/feed/
    - id: lobsters-ai
      group: ai-news
      url: https://lobste.rs/t/ai.rss
    - id: federal-register-ai
      group: ai-policy
      url: https://www.federalregister.gov/api/v1/articles.rss?conditions%5Bterm%5D=artificial+intelligence

arxiv:
  categories: ["cs.AI", "cs.CL", "cs.LG"]
  max_results: 20

gdelt:
  max_records: 15
  queries:
    - '(open-weight OR "open source") (model OR LLM) (release OR released)'
    - '("AI Act" OR "artificial intelligence regulation")'

openalex:
  # Optional. A free key in WT_OPENALEX_KEY raises the daily budget.
  # Casual calls work without one until the keyless budget is spent.
  search: "open weight language model"
  per_page: 10

bluesky:
  # Sampled window per cycle, not a gapless firehose. Set enabled: true and
  # pip install 'watch-tower[bluesky]'.
  enabled: false
  collect_seconds: 8
  max_posts: 40
  skip_replies: true
  # Public Jetstream subscribe endpoint (no account for the live tail).
  endpoint: wss://jetstream2.us-east.bsky.network/subscribe
  dids: []
  keywords_any: ["JEPA", "open-weight", "open weights", "System One"]

mastodon:
  instances:
    - https://mastodon.social
  hashtags: []
  limit: 20

# Kept off. wt.ingest.x_paid refuses to run even if this is flipped on.
x:
  enabled: false

# Names and URLs only, mined from World Monitor. Off so a normal cycle does
# not poll hundreds of feeds. See config/feeds/worldmonitor.yaml and
# docs/worldmonitor-ui.md.
worldmonitor:
  enabled: false
  catalog: config/feeds/worldmonitor.yaml
  per_feed: 5
