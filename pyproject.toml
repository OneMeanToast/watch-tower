[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-tower"
version = "0.4.0"
description = "Passive watcher: match news and OSINT against YAML indicators and alert on strong hits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Watch Tower contributors" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "feedparser>=6.0",
  "sqlite-vec>=0.1.6",
  "numpy>=1.26",
  "apprise>=1.8",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
extract = ["trafilatura>=2.0"]
bluesky = ["websockets>=13"]
guard = ["transformers>=4.44"]
dev = ["pytest>=8"]

[project.scripts]
wt = "wt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
